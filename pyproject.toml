[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencontext"
version = "0.1.0"
description = "Context management for coding agents, between the agent and its model's API"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
  "httpx>=0.28.0",
  "starlette>=0.47.0",
  "uvicorn>=0.35.0",
  "zstandard>=0.23",
]

[project.optional-dependencies]
rlm = ["openai>=2.52.0", "rlms==0.1.3"]
dev = ["openai>=2.52.0", "pytest>=8"]

[project.urls]
Homepage = "https://github.com/sunnweiwei/OpenContext"

[project.scripts]
opencontext = "opencontext.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["opencontext"]

[tool.pytest.ini_options]
testpaths = ["tests"]
